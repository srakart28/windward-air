<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windward Air: Island Circuit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10151d; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Windward Air: Island Circuit. Take off from Windward Field, fly six rings past the lighthouse and the volcano, and land at Ember Bay Strip. Arrow keys or mouse to steer, W and S for throttle, F for flaps, B to brake."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
